<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facts In Numbers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="facts" class="container">
        <div class="facts-wrapper">
            <img src="car_Image.png" class="bg-car" alt="Car Background">

            <div class="header text-center">
                <h2>Facts In Numbers</h2>
                <p>Amet cras hac orci lacus. Faucibus ipsum arcu lectus nibh sapien bibendum ullamcorper<br>in. Diam tincidunt tincidunt erat at semper fermentum</p>
            </div>

            <div class="row cards-row">
                <div class="card w-25 d-inline-block">
                    <div class="card-inner">
                        <div class="icon-box d-inline-block">
                            <i class="fa-solid fa-car"></i>
                        </div>
                        <div class="info d-inline-block">
                            <h3>540+</h3>
                            <p>Cars</p>
                        </div>
                    </div>
                </div>

                <div class="card w-25 d-inline-block">
                    <div class="card-inner">
                        <div class="icon-box d-inline-block">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <div class="info d-inline-block">
                            <h3>20k+</h3>
                            <p>Customers</p>
                        </div>
                    </div>
                </div>

                <div class="card w-25 d-inline-block">
                    <div class="card-inner">
                        <div class="icon-box d-inline-block">
                            <i class="fa-solid fa-calendar-check"></i>
                        </div>
                        <div class="info d-inline-block">
                            <h3>25+</h3>
                            <p>Years</p>
                        </div>
                    </div>
                </div>

                <div class="card w-25 d-inline-block">
                    <div class="card-inner">
                        <div class="icon-box d-inline-block">
                            <i class="fa-solid fa-gauge-high"></i>
                        </div>
                        <div class="info d-inline-block">
                            <h3>20m+</h3>
                            <p>Miles</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
