<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <h2>Alex Carter</h2>

        <p class="contact-info">
            Email: <a href="mailto:alex.carter.dev@example.com">alex.carter.dev@example.com</a>
        </p>
        <p class="contact-info">
            LinkedIn: <a href="https://linkedin.com" target="_blank">alex-carter-dev</a>

        <h3>About Me</h3>

        <p class="about-text">

        </p>
    </div>

</body>
</html>
